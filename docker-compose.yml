services:
    website:
        build:
            context: .
        restart: always
        expose:
            - 8000
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://127.0.0.1:8000/ >/dev/null 2>&1 || exit 1",
                ]
            interval: 5s
            timeout: 20s
            retries: 10
